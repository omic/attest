name: Test

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Build Rust extension first (attestdb depends on attest-py)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install maturin build
          .venv/bin/maturin build --release --locked \
            --manifest-path rust/attest-py/Cargo.toml \
            --out "$RUNNER_TEMP/oss-rust-dist" \
            --interpreter "$PWD/.venv/bin/python"
          .venv/bin/python -m pip install "$RUNNER_TEMP"/oss-rust-dist/*.whl

      - name: Install Python package and dev dependencies
        run: |
          source .venv/bin/activate
          pip install -e ".[dev,mcp]"

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: |
          source .venv/bin/activate
          pytest tests/integration/ -v --tb=short

      - name: Run golden vector tests
        run: |
          source .venv/bin/activate
          pytest tests/cross_lang/ -v --tb=short

      - name: Smoke test wheel install
        run: |
          .venv/bin/python -m build --outdir "$RUNNER_TEMP/oss-python-dist"
          .venv/bin/python scripts/verify_release_artifacts.py \
            "$RUNNER_TEMP"/oss-rust-dist/*.whl \
            "$RUNNER_TEMP"/oss-python-dist/*
          python -m venv "$RUNNER_TEMP/oss-smoke"
          "$RUNNER_TEMP/oss-smoke/bin/python" -m pip install \
            "$RUNNER_TEMP"/oss-rust-dist/*.whl \
            "$RUNNER_TEMP"/oss-python-dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/oss-smoke/bin/python" -I -c \
            "from attestdb import AttestDB; db = AttestDB(':memory:', embedding_dim=None); db.close(); print('installed OSS wheel smoke test OK')"

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run Rust tests
        working-directory: rust
        run: cargo test --locked --all

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint release changes
        run: |
          ruff check scripts/verify_release_artifacts.py \
            attestdb/infrastructure/embedding_index.py \
            attestdb/infrastructure/entity_resolver.py \
            tests/unit/test_release_artifacts.py \
            tests/unit/test_readme_example.py \
            tests/integration/test_entity_resolution.py \
            tests/integration/test_symmetric.py
